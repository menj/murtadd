name: Checks

# PHP syntax and the PHPUnit suite on the oldest and newest supported PHP.
# Composer is a development tool only; nothing it installs ships with the theme.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: composer lint

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: composer test -- --do-not-cache-result
