<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="murtadd">
	<title>murtadd</title>
	<rect width="512" height="512" rx="96" fill="#0f6e56"/>
	<!-- Lowercase m, set in the brand serif; the strike and the stop carry the identity. -->
	<text x="238" y="330" font-family="Source Serif 4, Georgia, serif" font-size="300" font-weight="700" fill="#ffffff" text-anchor="middle">m</text>
	<!-- Strike, as on the wordmark. -->
	<rect x="72" y="248" width="332" height="18" rx="9" fill="#ff7a68"/>
	<!-- Full stop. -->
	<circle cx="404" cy="318" r="26" fill="#5bc9bc"/>
</svg>
