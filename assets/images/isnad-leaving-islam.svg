<text class="lg" x="30" y="944">Two of the routes are drawn. The collections also print a second route for the saying through Qatada, listed in the tables below.</text>
<text class="lg" x="30" y="964">Marks record what the biographical dictionaries say. They are not a ruling on either report.</text>
